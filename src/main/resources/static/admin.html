<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="header"></div>

    <h1 class="titulo">PAINEL ADMINISTRATIVO</h1>

    <div class="box1">
        <button id="search">Buscar produto por ID</button>
        <button id="list">Listagem de todos os produtos</button>
        <button id="post">Cadastrar novo produto</button>
        <button id="delete">Remover item por ID</button>

        <table id="tabela" class="tabela">
            <thead>
                <tr id="tr" class="tr">
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Valor</th>
                    <th>Estoque</th>
                </tr>
            </thead>
            <tbody id="corpo_tabela" class="corpo_tabela">

            </tbody>
        </table>

        <button id="voltar" class="voltar">Voltar</button>

        <form id="formulario" class="formulario" method="post" enctype="multipart/form-data">
            <div class="campo">
                <label for="nome">Nome do produto: </label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="valor">Valor do produto: </label>
                <input type="text" id="valor" name="valor" required>
            </div>

            <div class="campo">
                <label for="estoque">Quantidade em estoque: </label>
                <input type="text" id="estoque" name="estoque" required>
            </div>

            <div class="campo">
                <label for="arquivoImagem">Imagem do anuncio(apenas formato PNG): </label>
                <input type="file" id="arquivoImagem" name="arquivoImagem" required accept="image/png">
            </div>

            <button id="cadastrar" type="submit">Cadastrar</button>
        </form>

        <div class="resultado_pesquisa" id="resultado_pesquisa"></div>

    </div>

</body>
<script src="index.js"></script>
</html>
