<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="header"></div>

    <h1 class="titulo">Painel ADM</h1>

    <div class="box1">
        <button id="search">Buscar produto por ID</button>
        <button id="list">Listagem de todos os produtos</button>
        <button id="post">Cadastrar novo produto</button>
        <button id="delete">Remover item por ID</button>

        <table id="tabela">
            <thead>
                <tr id="tr">
                    <th>Nome</th>
                    <th>Valor</th>
                    <th>Descrição</th>
                    <th>Imagem</th>
                    <th>Estoque</th>
                </tr>
            </thead>
            <tbody id="corpo_tabela">

            </tbody>
        </table>

        <button id="voltar" class="voltar">Voltar</button>

    </div>

</body>
<script src="index.js"></script>
</html>
